<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dizzar Official | Music, Videos & Exclusive Downloads</title>
    <meta name="title" content="Dizzar Official | Music, Videos & Exclusive Downloads">
    <meta name="description" content="The official home of Dizzar and Music Hunterz. Stream latest releases, watch official music videos, and unlock exclusive downloads.">
    <meta name="keywords" content="Dizzar, #filiru, Music Hunterz, Malawian Music, Afrobeats, DANCEHALL, Desire Mapira, Download Mp3">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CORE VARIABLES --- */
        :root {
            --primary-color: #00e5ff;
            --secondary-color: #ff007f;
            --bg-color: #050505;
            --surface-color: rgba(25, 25, 35, 0.6);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background: radial-gradient(circle at top left, #1a0b2e 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- RESPONSIVE HEADER --- */
        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem); /* Scales smoothly based on screen width */
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            color: var(--text-muted);
        }

        .socials {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap; /* Allows wrapping on tiny screens */
        }

        .socials a {
            color: var(--text-main);
            background: var(--surface-color);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            font-size: 1.2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- RESPONSIVE LAYOUT GRID --- */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            /* Magic grid: Stacks on mobile, side-by-side on desktop */
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
            gap: 30px;
            flex: 1;
            align-items: start; /* Prevents containers from stretching unnecessarily */
        }

        /* --- PANELS (Player & Playlist) --- */
        .panel {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: clamp(20px, 4vw, 30px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        /* --- MEDIA SCREEN --- */
        .media-screen {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            background: #111; /* Fallback color */
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .media-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures images don't stretch weirdly */
            position: absolute;
        }

        .song-info {
            text-align: center;
            margin: 20px 0;
        }

        .song-title {
            font-size: clamp(1.4rem, 3vw, 1.8rem);
            font-weight: 600;
            line-height: 1.2;
            margin-bottom: 5px;
        }

        .song-desc {
            color: var(--primary-color);
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* --- CONTROLS --- */
        .controls-main {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 15px 0;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-play {
            background: var(--primary-color);
            color: #000;
            font-size: 1.8rem;
            width: 65px;
            height: 65px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        /* Sliders */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: var(--primary-color);
        }

        .time-display {
            font-size: 0.85rem;
            color: var(--text-muted);
            min-width: 40px;
        }

        /* Download Button */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: not-allowed;
            width: 100%;
            text-align: center;
        }

        .download-btn.unlocked {
            background: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
        }

        /* --- PLAYLIST --- */
        .playlist-header {
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .track-list {
            overflow-y: auto;
            max-height: 450px;
            padding-right: 5px;
        }

        .track-list::-webkit-scrollbar { width: 6px; }
        .track-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            background: rgba(0,0,0,0.2);
            border: 1px solid transparent;
        }

        .track-item.active {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--primary-color);
        }

        .track-thumb {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            background: #222; /* Default background if image is broken */
        }

        .track-info {
            flex: 1;
            overflow: hidden; /* Prevents text from breaking layout */
        }

        .track-info h4 {
            font-size: 1rem;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* Adds '...' if title is too long */
        }

        .track-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            margin-top: auto;
            font-size: 0.9rem;
        }

        /* --- MOBILE SPECIFIC FIXES --- */
        @media (max-width: 600px) {
            .controls-main { gap: 10px; }
            .btn-play { width: 55px; height: 55px; font-size: 1.5rem; }
            .volume-slider-container { display: none; } /* Hide volume on mobile, users use hardware buttons */
        }
    </style>
</head>
<body>

<header>
    <h1>Dizzar Official</h1>
    <p>Music Hunterz Worldwide</p>
    <div class="socials">
        <a href="https://www.youtube.com/dizzar-mw"><i class="fa-brands fa-youtube"></i></a>
        <a href="#"><i class="fa-brands fa-tiktok"></i></a>
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
    </div>
</header>

<div class="container">
    
    <div class="panel">
        <div class="media-screen">
            <img id="coverImage" src="" alt="Album Cover" onerror="this.src='https://via.placeholder.com/500x500/111/fff?text=Dizzar'">
        </div>

        <div class="song-info">
            <h2 id="songTitle" class="song-title">Loading Music...</h2>
            <p id="songDesc" class="song-desc">Please wait</p>
        </div>

        <div class="slider-container">
            <span class="time-display" id="currentTime">0:00</span>
            <input type="range" id="seekSlider" value="0" step="0.1">
            <span class="time-display" id="durationTime">0:00</span>
        </div>

        <div class="controls-main">
            <button class="btn-control" onclick="player.prev()"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn-control btn-play" onclick="player.togglePlay()">
                <i class="fa-solid fa-play" id="playIcon"></i>
            </button>
            <button class="btn-control" onclick="player.next()"><i class="fa-solid fa-forward-step"></i></button>
        </div>

        <div class="slider-container volume-slider-container" style="justify-content: center; width: 70%; margin: 0 auto;">
            <i class="fa-solid fa-volume-low"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            <i class="fa-solid fa-volume-high"></i>
        </div>

        <a id="downloadBtn" class="download-btn" href="#" download>
            <i class="fa-solid fa-lock" id="dlIcon"></i> 
            <span id="dlText">Listen 15 Seconds To Unlock</span>
        </a>
    </div>

    <div class="panel">
        <h2 class="playlist-header">Up Next</h2>
        <div class="track-list" id="playlistContainer">
            </div>
    </div>

</div>

<footer>
    &copy; <span id="year"></span> Dizzar Official. All Rights Reserved.
</footer>

<audio id="audioPlayer"></audio>

<script>
    document.getElementById('year').innerText = new Date().getFullYear();

    class SmartPlayer {
        constructor(library) {
            this.library = library;
            this.currentIndex = 0;
            this.isPlaying = false;
            this.audioEl = document.getElementById('audioPlayer');
            
            // DOM Elements
            this.playIcon = document.getElementById('playIcon');
            this.seekSlider = document.getElementById('seekSlider');
            this.volSlider = document.getElementById('volumeSlider');
            
            this.listenTimer = null;
            this.secondsListened = 0;
            this.unlockThreshold = 15;
            this.isUnlocked = false;

            this.init();
        }

        init() {
            this.renderPlaylist();
            this.loadMedia(0);
            this.setupListeners();
        }

        loadMedia(index) {
            this.currentIndex = index;
            const media = this.library[index];

            document.getElementById('songTitle').innerText = media.title;
            document.getElementById('songDesc').innerText = media.artist;
            document.getElementById('coverImage').src = media.cover;

            this.resetDownload(media.src);
            this.pause(); 
            
            this.audioEl.src = media.src;
            this.audioEl.load();
            this.updateActivePlaylistItem();
            
            this.audioEl.onloadedmetadata = () => {
                this.seekSlider.max = this.audioEl.duration;
                document.getElementById('durationTime').innerText = this.formatTime(this.audioEl.duration);
            };
        }

        togglePlay() {
            if (this.isPlaying) {
                this.pause();
            } else {
                this.play();
            }
        }

        play() {
            this.audioEl.play();
            this.isPlaying = true;
            this.playIcon.classList.replace('fa-play', 'fa-pause');
            this.startListenTimer();
        }

        pause() {
            this.audioEl.pause();
            this.isPlaying = false;
            this.playIcon.classList.replace('fa-pause', 'fa-play');
            clearInterval(this.listenTimer);
        }

        next() {
            let nextIndex = this.currentIndex + 1;
            if (nextIndex >= this.library.length) nextIndex = 0;
            this.loadMedia(nextIndex);
            this.play();
        }

        prev() {
            let prevIndex = this.currentIndex - 1;
            if (prevIndex < 0) prevIndex = this.library.length - 1;
            this.loadMedia(prevIndex);
            this.play();
        }

        setupListeners() {
            this.seekSlider.addEventListener('input', () => {
                this.audioEl.currentTime = this.seekSlider.value;
            });

            this.volSlider.addEventListener('input', (e) => {
                this.audioEl.volume = e.target.value;
            });

            this.audioEl.addEventListener('timeupdate', () => {
                this.seekSlider.value = this.audioEl.currentTime;
                document.getElementById('currentTime').innerText = this.formatTime(this.audioEl.currentTime);
            });

            this.audioEl.addEventListener('ended', () => this.next());
        }

        startListenTimer() {
            if (this.isUnlocked) return;
            clearInterval(this.listenTimer);
            this.listenTimer = setInterval(() => {
                this.secondsListened++;
                if (this.secondsListened >= this.unlockThreshold) {
                    this.unlockDownload();
                }
            }, 1000);
        }

        resetDownload(fileSrc) {
            this.isUnlocked = false;
            this.secondsListened = 0;
            clearInterval(this.listenTimer);
            const btn = document.getElementById('downloadBtn');
            btn.href = "#";
            btn.className = "download-btn";
            document.getElementById('dlIcon').classList.replace('fa-download', 'fa-lock');
            document.getElementById('dlText').innerText = "Listen 15 Seconds To Unlock";
            btn.dataset.targetSrc = fileSrc;
        }

        unlockDownload() {
            this.isUnlocked = true;
            clearInterval(this.listenTimer);
            const btn = document.getElementById('downloadBtn');
            btn.href = btn.dataset.targetSrc;
            btn.className = "download-btn unlocked";
            document.getElementById('dlIcon').classList.replace('fa-lock', 'fa-download');
            document.getElementById('dlText').innerText = "Download Now";
        }

        formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            let min = Math.floor(seconds / 60);
            let sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' + sec : sec}`;
        }

        renderPlaylist() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            this.library.forEach((media, index) => {
                const div = document.createElement('div');
                div.className = `track-item ${index === this.currentIndex ? 'active' : ''}`;
                div.onclick = () => {
                    this.loadMedia(index);
                    this.play();
                };
                div.innerHTML = `
                    <img src="${media.cover}" class="track-thumb" onerror="this.src='https://via.placeholder.com/50/111/fff?text=D'">
                    <div class="track-info">
                        <h4>${media.title}</h4>
                        <p>${media.artist}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        updateActivePlaylistItem() {
            const items = document.querySelectorAll('.track-item');
            items.forEach((item, idx) => {
                if (idx === this.currentIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
    }

    // --- THE NEW MULTI-FORMAT GITHUB FETCHER ---
    async function loadDynamicLibrary() {
        try {
            const repo = 'dizzar-mw/Music'; 
            
            // 1. Fetch both the 'songs' folder AND the 'covers' folder at the same time
            const [songsResponse, coversResponse] = await Promise.all([
                fetch(`https://api.github.com/repos/${repo}/contents/songs`),
                fetch(`https://api.github.com/repos/${repo}/contents/covers`)
            ]);
            
            if (!songsResponse.ok) throw new Error("Could not fetch songs from GitHub");
            
            const songsFiles = await songsResponse.json();
            
            // 2. Build a dictionary of covers regardless of extension (.png, .jpg, .jpeg)
            const coversMap = {};
            if (coversResponse.ok) {
                const coversFiles = await coversResponse.json();
                coversFiles.forEach(file => {
                    // This chops off the extension. E.g., 'Track1.png' becomes 'Track1'
                    const nameWithoutExtension = file.name.substring(0, file.name.lastIndexOf('.'));
                    // We save it in lowercase to ensure 'TRACK1' and 'track1' still match perfectly
                    coversMap[nameWithoutExtension.toLowerCase()] = file.download_url;
                });
            }

            const dynamicLibrary = [];

            // 3. Match the songs to the covers
            for (const file of songsFiles) {
                if (file.name.endsWith('.mp3')) {
                    const fileNameNoExt = file.name.replace('.mp3', '');
                    const formattedTitle = fileNameNoExt.charAt(0).toUpperCase() + fileNameNoExt.slice(1);
                    
                    // Look in our covers dictionary for a match. 
                    // If no match is found, we leave it blank, and the CSS will use a fallback placeholder.
                    const matchedCoverUrl = coversMap[fileNameNoExt.toLowerCase()] || '';

                    dynamicLibrary.push({
                        title: formattedTitle,
                        artist: "Dizzar | Music Hunterz",
                        cover: matchedCoverUrl,
                        src: file.download_url
                    });
                }
            }
            
            // 4. Start the player
            if (dynamicLibrary.length > 0) {
                window.player = new SmartPlayer(dynamicLibrary);
            } else {
                document.getElementById('songTitle').innerText = "No songs found.";
                document.getElementById('songDesc').innerText = "Upload .mp3 files to GitHub";
            }

        } catch (error) {
            console.error("Error loading music:", error);
            document.getElementById('songTitle').innerText = "Connection Error";
            document.getElementById('songDesc').innerText = "Failed to load playlist from GitHub.";
        }
    }

    // Start everything up
    loadDynamicLibrary();

</script>

</body>
</html>
