<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dizzar Songs Official</title>

<meta name="description" content="Official website of Dizzar">
<meta name="robots" content="index,follow">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
min-height:100vh;
}

header{
text-align:center;
padding:30px;
background:#000;
border-bottom:1px solid #222;
}

header h1{
font-size:2.5rem;
}

header p{
color:#aaa;
margin-top:10px;
}

.socials{
margin-top:15px;
}

.socials a{
display:inline-block;
padding:10px 15px;
margin:4px;
background:#222;
color:white;
text-decoration:none;
border-radius:8px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.player{
background:#161616;
border-radius:20px;
padding:20px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

.cover{
width:100%;
height:300px;
object-fit:cover;
border-radius:15px;
}

.song-title{
font-size:1.8rem;
margin-top:15px;
}

.song-desc{
color:#bbb;
margin-top:5px;
}

.controls{
display:flex;
gap:10px;
margin-top:20px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#00aaff;
color:white;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.progress{
width:100%;
margin-top:15px;
}

input[type=range]{
width:100%;
}

.time{
display:flex;
justify-content:space-between;
font-size:.9rem;
color:#aaa;
}

.volume{
margin-top:15px;
}

.download{
display:inline-block;
margin-top:15px;
padding:12px 20px;
background:#444;
color:white;
text-decoration:none;
border-radius:10px;
pointer-events:none;
opacity:.5;
}

.playlist{
margin-top:30px;
}

.track{
padding:15px;
background:#1d1d1d;
margin-top:10px;
border-radius:10px;
cursor:pointer;
}

.track:hover{
background:#2a2a2a;
}

footer{
text-align:center;
padding:25px;
color:#888;
}
</style>
</head>
<body>

<header>
<h1>Dizzar Songs Official</h1>
<p>Music Hunterz Official Website</p>

<div class="socials">
<a href="#">YouTube</a>
<a href="#">TikTok</a>
<a href="#">Facebook</a>
<a href="#">Instagram</a>
</div>
</header>

<div class="container">

<div class="player">

<img id="cover" class="cover" src="covers/over.jpg">

<h2 id="title" class="song-title">Over</h2>

<p id="desc" class="song-desc">
Heart breaking song by Dizzar
</p>

<audio id="audio"></audio>

<div class="controls">
<button onclick="player.playSong()">Play</button>
<button onclick="player.pauseSong()">Pause</button>
<button onclick="player.previous()">Prev</button>
<button onclick="player.next()">Next</button>
</div>

<div class="progress">
<input type="range" id="seek" value="0">
</div>

<div class="time">
<span id="current">0:00</span>
<span id="duration">0:00</span>
</div>

<div class="volume">
Volume
<input type="range" id="volume" min="0" max="100" value="100">
</div>

<a id="downloadBtn"
class="download"
href=""
download>
Listen 15 Seconds To Unlock Download
</a>

</div>

<div class="playlist">
<h2>Playlist</h2>

<div id="playlist"></div>

</div>

</div>

<footer>
© Dizzar Songs Official
</footer>

<script>

const songs = [

{
title:"Over",
description:"Heart breaking song by Dizzar",
cover:"covers/over.jpg",
audio:"songs/over.mp3"
},

{
title:"Langa Ndi Fuso",
description:"Music Hunterz collaboration",
cover:"covers/langa.jpg",
audio:"songs/langa.mp3"
}

];

class DizzarPlayer{

constructor(){

this.audio=document.getElementById("audio");
this.index=0;

this.load(this.index);

this.audio.addEventListener("timeupdate",()=>{

let current=this.audio.currentTime;
let duration=this.audio.duration||0;

document.getElementById("seek").value=
(current/duration)*100||0;

document.getElementById("current").innerText=
this.format(current);

document.getElementById("duration").innerText=
this.format(duration);

});

this.audio.addEventListener("ended",()=>{
this.next();
});

}

load(index){

const song=songs[index];

document.getElementById("title").innerText=song.title;
document.getElementById("desc").innerText=song.description;
document.getElementById("cover").src=song.cover;

this.audio.src=song.audio;

const btn=document.getElementById("downloadBtn");

btn.href=song.audio;
btn.style.pointerEvents="none";
btn.style.opacity=".5";
btn.innerText="Listen 15 Seconds To Unlock Download";

setTimeout(()=>{
btn.style.pointerEvents="auto";
btn.style.opacity="1";
btn.innerText="Download Song";
},15000);

}

playSong(){
this.audio.play();
}

pauseSong(){
this.audio.pause();
}

next(){

this.index++;

if(this.index>=songs.length){
this.index=0;
}

this.load(this.index);
this.playSong();

}

previous(){

this.index--;

if(this.index<0){
this.index=songs.length-1;
}

this.load(this.index);
this.playSong();

}

format(time){

let mins=Math.floor(time/60);
let secs=Math.floor(time%60);

if(secs<10){
secs="0"+secs;
}

return mins+":"+secs;

}

}

const player=new DizzarPlayer();

document.getElementById("volume")
.addEventListener("input",e=>{
player.audio.volume=e.target.value/100;
});

document.getElementById("seek")
.addEventListener("input",e=>{

let seek=e.target.value;

player.audio.currentTime=
(player.audio.duration*seek)/100;

});

const playlist=document.getElementById("playlist");

songs.forEach((song,index)=>{

playlist.innerHTML+=`
<div class="track" onclick="player.index=${index};player.load(${index});player.playSong();">
${song.title}
</div>
`;

});

</script>

</body>
</html>
